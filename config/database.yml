# PostgreSQL configuration.
# Credentials are intentionally sourced from the environment so developer or
# production secrets are never committed to the repository.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  port: <%= ENV.fetch("PSQL_PORT") { 5432 } %>
  host: <%= ENV.fetch("PSQL_HOST") { "127.0.0.1" } %>
  username: <%= ENV.fetch("PSQL_USERNAME") { ENV.fetch("USER", "postgres") } %>
  password: <%= ENV["PSQL_PASSWORD"] %>

development:
  <<: *default
  database: <%= ENV.fetch("PSQL_DB_DEV_NAME") { "crypto_calculator_development" } %>

test:
  <<: *default
  database: <%= ENV.fetch("PSQL_DB_TEST_NAME") { "crypto_calculator_test" } %>

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
  database: <%= ENV.fetch("PSQL_DB_PROD_NAME") { "crypto_calculator_production" } %>
